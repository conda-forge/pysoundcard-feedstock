{% set name = "pysoundcard" %}
{% set version = "0.4.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/soundcard/soundcard-{{ version }}.tar.gz
  sha256: 07272ba927e32cafdf634e4a1ca53b9a3218321a60c7d2e08f54b832a56946aa

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - __linux     # [linux]
    - __osx       # [osx]
    - __win       # [win]
    - pulseaudio  # [linux]
    - numpy
    - cffi >=0.6

test:
  imports:
    - soundcard
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bastibe/SoundCard
  summary: Play and record audio without resorting to CPython extensions
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
